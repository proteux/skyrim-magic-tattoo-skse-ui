; RaceMenu overlay slot override.
;
; SKEE reads skee64.ini, then applies skee64_custom.ini on top per section, so
; only the keys changed here are overridden. This replaces the
; skee64_custom.ini shipped with Magic Tattoos Framework, so it repeats MTF's
; bPlayerOnly=0.

[Overlays]
bPlayerOnly=0 ; Default[1]. MTF needs 0 to draw tattoos on NPCs.

[Overlays/Body]
iNumOverlays=12 ; Default[6]

[Overlays/Face]
iNumOverlays=6 ; Default[3]

[Overlays/Hands]
iNumOverlays=6 ; Default[3]

[Overlays/Feet]
iNumOverlays=6 ; Default[3]
